<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="riverGrad" x1="60" y1="10" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EEAEA"/>
      <stop offset="40%" stop-color="#0ABFBC"/>
      <stop offset="100%" stop-color="#089A97"/>
    </linearGradient>
    <linearGradient id="islandGrad" x1="30" y1="60" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ABFBC"/>
      <stop offset="100%" stop-color="#1A7FBF"/>
    </linearGradient>
  </defs>

  <!-- Island base shape -->
  <ellipse cx="60" cy="92" rx="38" ry="18" fill="url(#islandGrad)" opacity="0.9"/>

  <!-- River flowing S-curve from top into island -->
  <path
    d="M60 12
       C60 12, 75 22, 72 35
       C69 48, 48 52, 50 65
       C52 78, 68 82, 65 92"
    stroke="url(#riverGrad)"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />

  <!-- River mouth spreading into island -->
  <path
    d="M50 78 C44 84, 38 88, 35 94"
    stroke="url(#riverGrad)"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
    opacity="0.6"
  />
  <path
    d="M62 84 C66 88, 72 90, 78 94"
    stroke="url(#riverGrad)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
    opacity="0.5"
  />

  <!-- Top water source glow -->
  <circle cx="60" cy="14" r="5" fill="#7EEAEA" opacity="0.8"/>
  <circle cx="60" cy="14" r="8" fill="#7EEAEA" opacity="0.2"/>
</svg>